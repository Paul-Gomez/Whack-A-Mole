<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-A-Mole · Resultados</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="pantalla">
        <h1 class="titulo">WHAC-A-MOLE</h1>

        <section class="tarjeta tarjeta-resultado">
            <h2 id="titularResultado"></h2>
            <p id="motivoResultado" class="motivo-resultado"></p>

            <ul class="resumen" aria-label="Resumen de la partida">
                <li>Puntuación: <strong id="puntos"></strong></li>
                <li>Tiempo empleado: <strong id="tiempo"></strong></li>
                <li>Topos golpeados: <strong id="topos"></strong></li>
                <li>Bombas desactivadas: <strong id="bombas"></strong></li>
                <li>Nivel: <strong id="nivel"></strong></li>
            </ul>

            <div class="botones">
                <button type="button" id="botonJugarDeNuevo" class="boton boton-primario">Jugar de nuevo</button>
                <button type="button" id="botonSalir" class="boton boton-secundario">Salir</button>
            </div>
        </section>
    </main>

    <script type="module" src="js/paginas/resultados.js"></script>
</body>
</html>
