<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-A-Mole · Inicio de sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="pantalla">
        <h1 class="titulo">WHAC-A-MOLE</h1>

        <section class="tarjeta tarjeta-login">
            <h2>Inicia sesión</h2>

            <form id="formLogin" novalidate>
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username">

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" autocomplete="current-password">

                <p id="mensajeError" class="mensaje-error" role="alert"></p>

                <button type="submit" class="boton boton-primario">Enviar</button>
            </form>
        </section>
    </main>

    <script type="module" src="js/paginas/login.js"></script>
</body>
</html>
